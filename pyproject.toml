[project]
name = "energy-consumption-visualization"
version = "0.1.0"
description = "Visualizes energy consumption data as SVG / PNG images"
authors = [
    {name = "Edmund Widl", email = "edmund.widl@ait.ac.at"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "redis>=5.2.1,<6.0.0",
    "click>=8.1.8,<9.0.0",
    "peewee>=3.17.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pyrdp-commons @ git+https://github.com/AIT-RDP/pyrdp-commons.git",
    "matplotlib>=3.10.9",
    "lxml>=6.1.1",
    "svgelements>=1.9.6",
    "resvg-py>=0.3.4",
    "pytz>=2026.3.post1",
    "pandas>=2.2.3",
]

[dependency-groups]
dev = [
    "pytest>=7.3.2,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_consumption_visualization"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
