<svg id="pipeline" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 1159.97px; background-color: white;" viewBox="0 0 1159.96875 70" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#pipeline{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#pipeline .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#pipeline .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#pipeline .error-icon{fill:#552222;}#pipeline .error-text{fill:#552222;stroke:#552222;}#pipeline .edge-thickness-normal{stroke-width:1px;}#pipeline .edge-thickness-thick{stroke-width:3.5px;}#pipeline .edge-pattern-solid{stroke-dasharray:0;}#pipeline .edge-thickness-invisible{stroke-width:0;fill:none;}#pipeline .edge-pattern-dashed{stroke-dasharray:3;}#pipeline .edge-pattern-dotted{stroke-dasharray:2;}#pipeline .marker{fill:#333333;stroke:#333333;}#pipeline .marker.cross{stroke:#333333;}#pipeline svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#pipeline p{margin:0;}#pipeline .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#pipeline .cluster-label text{fill:#333;}#pipeline .cluster-label span{color:#333;}#pipeline .cluster-label span p{background-color:transparent;}#pipeline .label text,#pipeline span{fill:#333;color:#333;}#pipeline .node rect,#pipeline .node circle,#pipeline .node ellipse,#pipeline .node polygon,#pipeline .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#pipeline .rough-node .label text,#pipeline .node .label text,#pipeline .image-shape .label,#pipeline .icon-shape .label{text-anchor:middle;}#pipeline .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#pipeline .rough-node .label,#pipeline .node .label,#pipeline .image-shape .label,#pipeline .icon-shape .label{text-align:center;}#pipeline .node.clickable{cursor:pointer;}#pipeline .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#pipeline .arrowheadPath{fill:#333333;}#pipeline .edgePaths .path{stroke:#333333;stroke-width:1px;}#pipeline .flowchart-link{stroke:#333333;fill:none;}#pipeline .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#pipeline .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#pipeline .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#pipeline .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#pipeline .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#pipeline .cluster text{fill:#333;}#pipeline .cluster span{color:#333;}#pipeline .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#pipeline .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#pipeline div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#pipeline .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#pipeline rect.text{fill:none;stroke-width:0;}#pipeline .icon-shape,#pipeline .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#pipeline .icon-shape p,#pipeline .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#pipeline .icon-shape .label rect,#pipeline .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#pipeline .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#pipeline .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#pipeline .node .neo-node{stroke:#9370DB;}#pipeline [data-look="neo"].node rect,#pipeline [data-look="neo"].cluster rect,#pipeline [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#pipeline [data-look="neo"].swimlane.cluster rect{filter:none;}#pipeline [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#pipeline [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#pipeline [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#pipeline [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#pipeline [data-look="neo"].node circle .state-start{fill:#000000;}#pipeline [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#pipeline [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#pipeline :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="pipeline_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="pipeline_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="pipeline_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="pipeline_flowchart-v2-pointStart-margin" class="marker flowc